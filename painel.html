<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Realize Festas — Painel</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f0; min-height: 100vh; padding: 1rem; color: #1a1a1a; }
.app { max-width: 760px; margin: 0 auto; background: white; border-radius: 16px; padding: 1.5rem; box-shadow: 0 2px 16px rgba(0,0,0,0.08); }
.header { text-align: center; padding: 0.5rem 0 1rem; border-bottom: 1px solid #eee; margin-bottom: 1.5rem; }
.header h1 { font-size: 18px; font-weight: 600; }
.header p { font-size: 12px; color: #888; margin-top: 3px; }

.sec { font-size: 11px; font-weight: 600; color: #888; text-transform: uppercase; letter-spacing: 0.06em; margin: 1.4rem 0 0.7rem; }
.sec:first-of-type { margin-top: 0.4rem; }
.field { margin-bottom: 0.9rem; }
.field label { display: block; font-size: 13px; color: #555; margin-bottom: 3px; }
.field input, .field select, .field textarea {
  width: 100%; padding: 10px 12px; font-size: 14px;
  border: 1px solid #ddd; border-radius: 8px;
  background: white; color: #1a1a1a;
  font-family: inherit;
}
.field input:focus { outline: none; border-color: #1D9E75; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.btn { padding: 12px; font-size: 14px; font-weight: 600; border-radius: 10px; cursor: pointer; border: none; transition: opacity 0.2s; }
.btn-g { background: #1D9E75; color: white; }
.btn-s { background: #f5f5f5; color: #333; border: 1px solid #ddd; }
.btn-d { background: #fdecec; color: #c0392b; border: 1px solid #f3c6c6; }
.btn:active { opacity: 0.85; }
.btn-full { width: 100%; }

.tabs { display: flex; gap: 8px; margin-bottom: 1.2rem; }
.tab-btn { flex: 1; padding: 10px; font-size: 13px; font-weight: 600; border-radius: 10px; border: 1px solid #ddd; background: #fafafa; color: #666; cursor: pointer; }
.tab-btn.on { background: #1D9E75; color: white; border-color: #1D9E75; }

.tag { display: inline-block; font-size: 11px; padding: 3px 10px; border-radius: 20px; font-weight: 600; }
.tag-fechado { background: #fdecec; color: #c0392b; }
.tag-pendente { background: #fff6e0; color: #a6740a; }
.tag-manual { background: #eaeaea; color: #555; }

/* Calendário */
.cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.6rem; }
.cal-nav button { background: #f5f5f5; border: 1px solid #ddd; border-radius: 8px; width: 34px; height: 34px; font-size: 16px; cursor: pointer; }
.cal-nav span { font-size: 14px; font-weight: 600; text-transform: capitalize; }
.calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 0.5rem; }
.cal-dow { text-align: center; font-size: 10px; color: #999; font-weight: 600; padding-bottom: 4px; }
.cal-day { aspect-ratio: 1; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 12.5px; cursor: pointer; border: 1px solid #eee; background: #fafafa; color: #333; position: relative; }
.cal-day.empty { visibility: hidden; cursor: default; }
.cal-day.livre:hover { border-color: #1D9E75; }
.cal-day.fechado { background: #fdecec; color: #c0392b; border-color: #f3c6c6; font-weight: 600; }
.cal-day.hoje { box-shadow: inset 0 0 0 2px #1D9E75; }
.legenda { display: flex; gap: 14px; font-size: 11px; color: #666; margin-bottom: 0.4rem; }
.legenda span { display: inline-flex; align-items: center; gap: 5px; }
.legenda i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

.resultado-box { background: #f0faf6; border: 1px solid #b2dfcf; border-radius: 10px; padding: 0.9rem 1.1rem; font-size: 13px; line-height: 1.6; margin: 0.6rem 0 1rem; display: none; }
.resultado-box.fechado { background: #fdecec; border-color: #f3c6c6; }
.resultado-box.v { display: block; }

/* Lista de contratos */
.contrato-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 4px; border-bottom: 1px solid #eee; cursor: pointer; gap: 10px; }
.contrato-item:hover { background: #fafafa; }
.contrato-item .info b { font-size: 13.5px; display: block; }
.contrato-item .info span { font-size: 11.5px; color: #888; }
.busca-contrato { margin-bottom: 0.8rem; }
.empty-state { text-align: center; color: #999; font-size: 13px; padding: 2rem 0; }

/* Modal */
.modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); align-items: center; justify-content: center; padding: 1rem; z-index: 50; }
.modal.v { display: flex; }
.modal-content { background: white; border-radius: 14px; max-width: 480px; width: 100%; max-height: 85vh; overflow-y: auto; padding: 1.4rem; position: relative; }
.modal-close { position: absolute; top: 10px; right: 10px; background: #f5f5f5; border: none; border-radius: 50%; width: 30px; height: 30px; cursor: pointer; font-size: 14px; }
.modal-content h3 { font-size: 16px; margin-bottom: 0.9rem; padding-right: 1.6rem; }
.modal-row { font-size: 13px; margin-bottom: 8px; line-height: 1.5; }
.modal-row b { color: #555; display: inline-block; min-width: 118px; }
.modal-sec { font-size: 11px; font-weight: 700; color: #1D9E75; text-transform: uppercase; letter-spacing: 0.05em; margin: 1rem 0 0.4rem; }
.link-box { display: flex; gap: 6px; margin-top: 0.4rem; }
.link-box input { flex: 1; font-size: 11px; padding: 8px; border: 1px solid #ddd; border-radius: 6px; background: #fafafa; }

#s-gate { max-width: 320px; margin: 2rem auto; text-align: center; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>🗂️ Painel Realize Festas e Eventos</h1>
    <p>Agenda e contratos</p>
  </div>

  <!-- ACESSO -->
  <div id="s-gate">
    <div class="field"><label>Senha de acesso</label><input id="senha" type="password" placeholder="Digite a senha" onkeydown="if(event.key==='Enter')entrar()"></div>
    <button class="btn btn-g btn-full" onclick="entrar()">Entrar</button>
    <p id="erroSenha" style="color:#c0392b;font-size:12px;margin-top:8px;display:none;">Senha incorreta.</p>
  </div>

  <!-- PAINEL -->
  <div id="s-painel" style="display:none;">
    <div class="tabs">
      <button class="tab-btn on" id="tabBtnAgenda" onclick="mostrarTab('agenda')">📅 Agenda</button>
      <button class="tab-btn" id="tabBtnContratos" onclick="mostrarTab('contratos')">📋 Contratos</button>
    </div>

    <!-- TAB AGENDA -->
    <div id="tab-agenda">
      <div class="sec">Consultar disponibilidade</div>
      <div class="row2">
        <div class="field" style="margin-bottom:0;"><input id="buscaData" type="date"></div>
        <button class="btn btn-s" onclick="consultarData()">Consultar</button>
      </div>
      <div id="resultadoBusca" class="resultado-box"></div>

      <div class="sec">Calendário</div>
      <div class="legenda">
        <span><i style="background:#fdecec;border:1px solid #f3c6c6;"></i>Fechada</span>
        <span><i style="background:#fafafa;border:1px solid #eee;"></i>Disponível</span>
      </div>
      <div class="cal-nav">
        <button onclick="mudarMes(-1)">‹</button>
        <span id="mesAtual"></span>
        <button onclick="mudarMes(1)">›</button>
      </div>
      <div class="calendar-grid" id="calDow"></div>
      <div class="calendar-grid" id="calendario"></div>

      <div class="sec">Fechar data manualmente (sem contrato)</div>
      <div class="row2">
        <div class="field"><label>Data</label><input id="bloqData" type="date"></div>
        <div class="field"><label>Motivo (opcional)</label><input id="bloqMotivo" type="text" placeholder="Ex: reserva, manutenção..."></div>
      </div>
      <button class="btn btn-g btn-full" onclick="fecharDataManual()">Fechar esta data</button>
    </div>

    <!-- TAB CONTRATOS -->
    <div id="tab-contratos" style="display:none;">
      <div class="sec">Todos os contratos</div>
      <div class="field busca-contrato"><input id="buscaContrato" type="text" placeholder="Buscar por nome, evento ou data..." oninput="renderContratos()"></div>
      <div id="listaContratos"></div>
    </div>
  </div>

  <!-- MODAL DETALHES DO DIA -->
  <div class="modal" id="modalDia">
    <div class="modal-content">
      <button class="modal-close" onclick="fecharModal('modalDia')">✕</button>
      <div id="modalDiaBody"></div>
    </div>
  </div>

  <!-- MODAL CONTRATO -->
  <div class="modal" id="modalContrato">
    <div class="modal-content">
      <button class="modal-close" onclick="fecharModal('modalContrato')">✕</button>
      <div id="modalContratoBody"></div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue, set, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCju3LRA5CTpUcIpkY7gNpw_rpiGb9WMSo",
  authDomain: "realize-contrato-e0998.firebaseapp.com",
  databaseURL: "https://realize-contrato-e0998-default-rtdb.firebaseio.com",
  projectId: "realize-contrato-e0998",
  storageBucket: "realize-contrato-e0998.firebasestorage.app",
  messagingSenderId: "733550691411",
  appId: "1:733550691411:web:90dd28105730c867cdb2a6"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// Ajuste aqui o nome do arquivo do formulário de contrato, caso seja diferente:
const ARQUIVO_CONTRATO = "index.html";

// Senha simples de acesso ao painel (proteção básica de tela — troque à vontade).
// A segurança real dos dados deve ser garantida pelas regras do Firebase.
const SENHA_PAINEL = "realize2026";

let contratosCache = {};
let agendaCache = {};
let mesRef = new Date(); mesRef.setDate(1);

function fdata(v){ if(!v)return'—'; const[y,m,d]=v.split('-'); return`${d}/${m}/${y}`; }
function fval(v){ if(!v||isNaN(v))return'—'; return'R$ '+parseFloat(v).toLocaleString('pt-BR',{minimumFractionDigits:2}); }
function hojeISO(){ const d=new Date(); return d.toISOString().slice(0,10); }

// ---------- Acesso ----------
window.entrar = function(){
  const v = document.getElementById('senha').value;
  if(v === SENHA_PAINEL){
    sessionStorage.setItem('painelOk','1');
    document.getElementById('s-gate').style.display='none';
    document.getElementById('s-painel').style.display='block';
    iniciar();
  } else {
    document.getElementById('erroSenha').style.display='block';
  }
}
if(sessionStorage.getItem('painelOk')==='1'){
  document.getElementById('s-gate').style.display='none';
  document.getElementById('s-painel').style.display='block';
  iniciar();
}

function iniciar(){
  onValue(ref(db,'contratos'), snap=>{ contratosCache = snap.val()||{}; renderContratos(); renderCalendario(); });
  onValue(ref(db,'agenda'), snap=>{ agendaCache = snap.val()||{}; renderCalendario(); });
}

// ---------- Tabs ----------
window.mostrarTab = function(nome){
  document.getElementById('tab-agenda').style.display = nome==='agenda' ? 'block':'none';
  document.getElementById('tab-contratos').style.display = nome==='contratos' ? 'block':'none';
  document.getElementById('tabBtnAgenda').classList.toggle('on', nome==='agenda');
  document.getElementById('tabBtnContratos').classList.toggle('on', nome==='contratos');
}

// ---------- Consulta de disponibilidade ----------
window.consultarData = function(){
  const data = document.getElementById('buscaData').value;
  const box = document.getElementById('resultadoBusca');
  if(!data){ box.classList.remove('v'); return; }
  const item = agendaCache[data];
  box.classList.add('v');
  if(item && item.status==='fechado'){
    box.classList.add('fechado');
    const desc = item.tipo==='contrato'
      ? `Evento: <b>${item.evento||'—'}</b> — Cliente: <b>${item.nome||'—'}</b>${item.hinicio?` — ${item.hinicio} às ${item.hfim||''}`:''}`
      : `Motivo: <b>${item.motivo||'Bloqueio manual'}</b>`;
    box.innerHTML = `🔴 <b>Data ${fdata(data)} está FECHADA.</b><br>${desc}`;
  } else {
    box.classList.remove('fechado');
    box.innerHTML = `🟢 <b>Data ${fdata(data)} está disponível.</b>`;
  }
}

// ---------- Calendário ----------
const DOWS = ['D','S','T','Q','Q','S','S'];
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];

function montarCabecalhoDow(){
  const el = document.getElementById('calDow');
  el.innerHTML = DOWS.map(d=>`<div class="cal-dow">${d}</div>`).join('');
}
montarCabecalhoDow();

window.mudarMes = function(delta){
  mesRef.setMonth(mesRef.getMonth()+delta);
  renderCalendario();
}

function renderCalendario(){
  document.getElementById('mesAtual').textContent = `${MESES[mesRef.getMonth()]} de ${mesRef.getFullYear()}`;
  const el = document.getElementById('calendario');
  const ano = mesRef.getFullYear(), mes = mesRef.getMonth();
  const primeiroDia = new Date(ano, mes, 1).getDay();
  const totalDias = new Date(ano, mes+1, 0).getDate();
  const hoje = hojeISO();

  let html = '';
  for(let i=0;i<primeiroDia;i++) html += `<div class="cal-day empty"></div>`;
  for(let dia=1; dia<=totalDias; dia++){
    const mm = String(mes+1).padStart(2,'0');
    const dd = String(dia).padStart(2,'0');
    const iso = `${ano}-${mm}-${dd}`;
    const item = agendaCache[iso];
    const fechado = item && item.status==='fechado';
    const classes = ['cal-day', fechado?'fechado':'livre', iso===hoje?'hoje':''].join(' ');
    html += `<div class="${classes}" onclick="clicarDia('${iso}')">${dia}</div>`;
  }
  el.innerHTML = html;
}

window.clicarDia = function(iso){
  const item = agendaCache[iso];
  const body = document.getElementById('modalDiaBody');
  if(item && item.status==='fechado'){
    const detalhes = item.tipo==='contrato'
      ? `<div class="modal-row"><b>Cliente:</b> ${item.nome||'—'}</div>
         <div class="modal-row"><b>Evento:</b> ${item.evento||'—'}</div>
         <div class="modal-row"><b>Horário:</b> ${item.hinicio||'—'} às ${item.hfim||'—'}</div>`
      : `<div class="modal-row"><b>Motivo:</b> ${item.motivo||'Bloqueio manual'}</div>`;
    const botaoContrato = item.tipo==='contrato'
      ? `<button class="btn btn-s btn-full" style="margin-top:10px;" onclick="fecharModal('modalDia');abrirContrato('${item.contratoId}')">Ver contrato completo</button>`
      : `<button class="btn btn-d btn-full" style="margin-top:10px;" onclick="desbloquearData('${iso}')">Desbloquear esta data</button>`;
    body.innerHTML = `
      <h3>📅 ${fdata(iso)} — <span class="tag tag-fechado">Fechada</span></h3>
      ${detalhes}
      ${botaoContrato}
    `;
  } else {
    body.innerHTML = `
      <h3>📅 ${fdata(iso)} — <span class="tag tag-pendente" style="background:#e1f5ee;color:#0f6e56;">Disponível</span></h3>
      <div class="modal-row">Essa data ainda não possui evento nem bloqueio.</div>
      <button class="btn btn-g btn-full" style="margin-top:10px;" onclick="fecharModal('modalDia');document.getElementById('bloqData').value='${iso}';document.getElementById('bloqMotivo').focus();">Fechar esta data manualmente</button>
    `;
  }
  document.getElementById('modalDia').classList.add('v');
}

window.desbloquearData = async function(iso){
  if(!confirm(`Remover o bloqueio manual da data ${fdata(iso)}?`)) return;
  try{
    await remove(ref(db,'agenda/'+iso));
    fecharModal('modalDia');
  }catch(e){ alert('Erro ao desbloquear: '+e.message); }
}

// ---------- Fechar data manual ----------
window.fecharDataManual = async function(){
  const data = document.getElementById('bloqData').value;
  const motivo = document.getElementById('bloqMotivo').value.trim();
  if(!data){ alert('Escolha uma data.'); return; }
  const existente = agendaCache[data];
  if(existente && existente.status==='fechado'){
    alert('Essa data já está fechada na agenda.');
    return;
  }
  try{
    await set(ref(db,'agenda/'+data), {
      status:'fechado', tipo:'manual', motivo: motivo||'Bloqueio manual',
      criadoEm: new Date().toISOString()
    });
    document.getElementById('bloqData').value='';
    document.getElementById('bloqMotivo').value='';
    alert('Data fechada com sucesso.');
  }catch(e){ alert('Erro ao fechar data: '+e.message); }
}

// ---------- Lista de contratos ----------
function renderContratos(){
  const el = document.getElementById('listaContratos');
  const termo = (document.getElementById('buscaContrato')?.value||'').toLowerCase();
  const entradas = Object.entries(contratosCache)
    .filter(([id,d])=>{
      if(!termo) return true;
      return (d.nome||'').toLowerCase().includes(termo)
        || (d.evento||'').toLowerCase().includes(termo)
        || (d.data||'').includes(termo);
    })
    .sort((a,b)=> (b[1].criadoEm||'').localeCompare(a[1].criadoEm||''));

  if(entradas.length===0){
    el.innerHTML = `<div class="empty-state">Nenhum contrato encontrado.</div>`;
    return;
  }

  el.innerHTML = entradas.map(([id,d])=>{
    const status = d.status==='fechado' ? '<span class="tag tag-fechado">Fechado</span>' : '<span class="tag tag-pendente">Pendente</span>';
    return `
      <div class="contrato-item" onclick="abrirContrato('${id}')">
        <div class="info">
          <b>${d.nome||'(sem nome)'}</b>
          <span>${d.evento||'—'} · ${fdata(d.data)}</span>
        </div>
        ${status}
      </div>
    `;
  }).join('');
}

window.abrirContrato = function(id){
  const d = contratosCache[id];
  if(!d){ alert('Contrato não encontrado.'); return; }
  const body = document.getElementById('modalContratoBody');
  const status = d.status==='fechado' ? '<span class="tag tag-fechado">Fechado</span>' : '<span class="tag tag-pendente">Pendente</span>';
  const link = `${location.origin}${location.pathname.replace(/[^/]+$/,'')}${ARQUIVO_CONTRATO}?id=${id}`;

  body.innerHTML = `
    <h3>${d.nome||'(sem nome)'} ${status}</h3>

    <div class="modal-sec">Dados do cliente</div>
    <div class="modal-row"><b>CPF / RG:</b> ${d.cpf||'—'} / ${d.rg||'—'}</div>
    <div class="modal-row"><b>Endereço:</b> ${d.rua||'—'}, ${d.bairro||'—'} — ${d.cidade||'—'}/${d.estado||'—'} — ${d.cep||'—'}</div>
    <div class="modal-row"><b>Telefone:</b> ${d.tel||'—'}</div>

    <div class="modal-sec">Evento</div>
    <div class="modal-row"><b>Tipo:</b> ${d.evento||'—'}</div>
    <div class="modal-row"><b>Aniversariante:</b> ${d.anivNome||'—'} (${d.anivIdade||'—'} anos)</div>
    <div class="modal-row"><b>Data:</b> ${fdata(d.data)}</div>
    <div class="modal-row"><b>Horário:</b> ${d.hinicio||'—'} às ${d.hfim||'—'}</div>
    <div class="modal-row"><b>Pagantes:</b> ${d.pagantes||'—'}</div>

    <div class="modal-sec">Cardápio e decoração</div>
    <div class="modal-row"><b>Cardápio:</b> ${d.cardapio||'—'}</div>
    <div class="modal-row"><b>Decoração inclusa:</b> ${d.decInc?'Sim':'Não'} ${d.decDesc?('— '+d.decDesc):''}</div>

    <div class="modal-sec">Pagamento</div>
    <div class="modal-row"><b>Valor (cliente):</b> ${fval(d.valor)}</div>
    <div class="modal-row"><b>Condições:</b> ${d.pagto||'—'}</div>
    ${d.status==='fechado' ? `
      <div class="modal-row"><b>Valor final:</b> ${fval(d.cValor)}</div>
      <div class="modal-row"><b>Valor/pagante (até limite):</b> ${fval(d.cVp1)}</div>
      <div class="modal-row"><b>Valor/pagante (após limite):</b> ${fval(d.cVp2)}</div>
      <div class="modal-row"><b>Data limite:</b> ${fdata(d.cDlimite)}</div>
      <div class="modal-row"><b>Fechado em:</b> ${d.fechadoEm ? new Date(d.fechadoEm).toLocaleString('pt-BR') : '—'}</div>
    ` : ''}

    ${d.obs ? `<div class="modal-sec">Observações</div><div class="modal-row">${d.obs}</div>` : ''}

    <div class="modal-sec">Link do contrato</div>
    <div class="link-box">
      <input type="text" readonly value="${link}" onclick="this.select()">
      <button class="btn btn-s" onclick="navigator.clipboard.writeText('${link}');this.textContent='Copiado!'">Copiar</button>
    </div>
  `;
  document.getElementById('modalContrato').classList.add('v');
}

window.fecharModal = function(id){
  document.getElementById(id).classList.remove('v');
}
</script>
</body>
</html>
